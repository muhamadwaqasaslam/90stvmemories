name: Daily Auto-Post Bot to Blogger & Web 2.0

on:
  schedule:
    # Runs daily at 12:00 PM UTC (5:00 PM PKT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Daily Auto-Post Bot
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python bot/auto_bot.py

      - name: Commit and Push Updated Queue
        run: |
          git config --global user.name "90s TV Memories Bot"
          git config --global user.email "bot@90stvmemories.com"
          git add bot/articles_db.json
          git commit -m "🤖 [BOT] Daily post published & queue updated [skip ci]" || echo "No changes to commit"
          git push
